<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIKŌ — Task Intelligence</title>
<meta name="description" content="An offline-first task manager: natural-language capture, dependencies, recurring work, automations, and a keyboard-first interface.">
<meta name="theme-color" content="#faf9f7">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MIKŌ">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- The display face carries the wordmark on the splash, so it has to arrive
     before first paint or the brand flashes in a fallback. -->
<link rel="preload" href="assets/fonts/Locanita.ttf" as="font" type="font/ttf" crossorigin>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650&family=JetBrains+Mono:wght@400;500&display=swap">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/landing.css">

<style>
  /* Splash. Inline so it paints before any stylesheet resolves — a slow font
     or a cold service worker must never show a blank page. It doubles as the
     brand moment: this is the one place the wordmark gets to be large. */
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #faf9f7;
    color: #191612;
    z-index: 999;
    transition: opacity .45s ease, visibility .45s;
  }
  @media (prefers-color-scheme: dark) {
    #boot { background: #0d0e10; color: #eceef1; }
  }
  body.ready #boot { opacity: 0; visibility: hidden; pointer-events: none; }

  .splash {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    animation: splash-in .5s cubic-bezier(.16,1,.3,1) both;
  }

  /* MIK + a hand-drawn macron. Locanita has no Ō glyph, so rendering "MIKŌ"
     directly drops the last letter into a fallback face mid-word. Drawing the
     bar keeps the whole wordmark in one typeface. */
  .splash-word {
    font-family: 'Miko Display', 'Times New Roman', serif;
    font-size: clamp(56px, 14vw, 92px);
    line-height: 1;
    letter-spacing: .06em;
    display: flex;
    align-items: baseline;
  }
  .splash-word .o { position: relative; color: #b1500c; }
  @media (prefers-color-scheme: dark) { .splash-word .o { color: #e07b32; } }
  .splash-word .o::after {
    content: '';
    position: absolute;
    left: 6%; right: 14%;
    top: -.14em;
    height: .07em;
    background: currentColor;
    border-radius: 2px;
  }

  .splash-tag {
    font: 500 13px/1 ui-sans-serif, system-ui, -apple-system, sans-serif;
    letter-spacing: .22em;
    text-transform: uppercase;
    opacity: .62;
  }
  .splash-by {
    font: 400 12px/1 ui-sans-serif, system-ui, -apple-system, sans-serif;
    letter-spacing: .04em;
    opacity: .38;
    margin-top: 2px;
  }
  .splash-rule {
    width: 28px; height: 2px; border-radius: 2px;
    background: #b1500c; opacity: .55;
    animation: splash-pulse 1.5s ease-in-out infinite;
  }
  @media (prefers-color-scheme: dark) { .splash-rule { background: #e07b32; } }

  @keyframes splash-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes splash-pulse {
    0%, 100% { opacity: .5; transform: scaleX(.6); }
    50%      { opacity: 1;  transform: scaleX(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .splash, .splash-rule { animation: none; }
  }

  #noscript {
    max-width: 34ch;
    text-align: center;
    font: 400 14px/1.6 ui-sans-serif, system-ui, sans-serif;
    color: #635c52;
  }
</style>
</head>
<body>

<div id="boot" role="status" aria-label="Loading MIKŌ">
  <div class="splash">
    <div class="splash-word" aria-hidden="true">MIK<span class="o">O</span></div>
    <div class="splash-rule" aria-hidden="true"></div>
    <div class="splash-tag">Task Intelligence</div>
    <div class="splash-by">by Michael Gaitho</div>
  </div>
</div>

<noscript>
  <div style="display:grid;place-items:center;height:100dvh;padding:24px">
    <p id="noscript">
      MIKŌ needs JavaScript to run. Everything happens in your browser —
      there is no server doing the work.
    </p>
  </div>
</noscript>

<div id="landing" hidden></div>
<div id="app"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
