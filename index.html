<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIKŌ</title>
<meta name="description" content="An offline-first task manager: natural-language capture, dependencies, recurring work, automations, and a keyboard-first interface.">
<meta name="theme-color" content="#faf9f7">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MIKŌ">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- The display face carries the wordmark on the splash, so it has to arrive
     before first paint or the brand flashes in a fallback. -->
<link rel="preload" href="assets/fonts/Locanita.ttf" as="font" type="font/ttf" crossorigin>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650&family=JetBrains+Mono:wght@400;500&display=swap">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/landing.css">

<style>
  /* Splash. Inline so it paints before any stylesheet resolves — a slow font
     or a cold service worker must never show a blank page. It doubles as the
     brand moment: this is the one place the wordmark gets to be large. */
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #faf9f7;
    color: #191612;
    z-index: 999;
    transition: opacity .45s ease, visibility .45s;
  }
  @media (prefers-color-scheme: dark) {
    #boot { background: #0d0e10; color: #eceef1; }
  }
  /* An explicit choice beats the device preference. main.js sets data-theme
     while the splash is still up, so a visitor who picked light does not watch
     a dark splash hand over to a light app. */
  [data-theme='dark'] #boot { background: #0d0e10; color: #eceef1; }
  [data-theme='light'] #boot { background: #faf9f7; color: #191612; }
  [data-theme='light'] .splash-word .o,
  [data-theme='dark'] .splash-word .o { color: #e07b32; }
  body.ready #boot { opacity: 0; visibility: hidden; pointer-events: none; }

  .splash {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* MIK + a hand-drawn macron. Locanita has no Ō glyph, so rendering "MIKŌ"
     directly drops the last letter into a fallback face mid-word. Drawing the
     bar keeps the whole wordmark in one typeface — and since the bar is ours
     to draw, the splash draws it: the letters land, then the macron strokes
     across the O left to right. */
  .splash-word {
    position: relative;
    font-family: 'Miko Display', 'Times New Roman', serif;
    font-size: clamp(76px, 19vw, 150px);
    line-height: 1;
    letter-spacing: .06em;
    display: inline-flex;
    align-items: baseline;
    padding-right: .06em;
  }

  /* The wordmark is written, not faded in: a nib travels left to right and the
     letters appear in its wake, then it lifts and settles as the macron over
     the O. The macron was always drawn in CSS — Locanita has no Ō glyph — so
     the splash simply shows it being drawn. */
  .splash-reveal {
    display: inline-block;
    /* The macron reaches above the glyph box, and clip-path clips to the
       border box — without this it was being cut off, which is why the little
       line over the O never appeared. The negative margin keeps the layout
       exactly where it was. */
    padding-top: .24em;
    margin-top: -.24em;
    clip-path: inset(0 100% 0 0);
    animation: write .95s cubic-bezier(.5,.02,.2,1) .15s forwards;
  }

  .splash-nib {
    position: absolute;
    left: 0;
    top: .06em;
    width: .1em;
    height: .07em;
    border-radius: 2px;
    background: #b1500c;
    opacity: 0;
    animation: nib-travel .95s cubic-bezier(.5,.02,.2,1) .15s forwards;
  }
  @media (prefers-color-scheme: dark) { .splash-nib { background: #e07b32; } }
  [data-theme='dark'] .splash-nib { background: #e07b32; }
  [data-theme='light'] .splash-nib { background: #b1500c; }

  .splash-word .o { position: relative; color: #b1500c; }
  @media (prefers-color-scheme: dark) { .splash-word .o { color: #e07b32; } }
  .splash-word .o::after {
    content: '';
    position: absolute;
    left: 6%; right: 14%;
    top: -.14em;
    height: .07em;
    background: currentColor;
    border-radius: 2px;
    opacity: 0;
    /* Settles into place, then keeps a slow pulse — the loading beat now
       lives on the mark itself rather than a separate rule. */
    animation:
      macron-settle .3s ease-out 1.05s both,
      macron-pulse 1.9s ease-in-out 1.45s infinite;
  }

  .splash-by {
    font: 400 14px/1 ui-sans-serif, system-ui, -apple-system, sans-serif;
    letter-spacing: .04em;
    opacity: .72;
    margin-top: 4px;
    animation: fade-up-by .6s cubic-bezier(.16,1,.3,1) 1.2s both;
  }
  /* The company name is the point of the line — the "by" is the quiet part. */
  .splash-co {
    font-weight: 600;
    letter-spacing: .06em;
    color: #b1500c;
  }
  @media (prefers-color-scheme: dark) { .splash-co { color: #e07b32; } }
  [data-theme='dark'] .splash-co { color: #e07b32; }
  [data-theme='light'] .splash-co { color: #b1500c; }

  /* The letters appear in the nib's wake. */
  @keyframes write {
    from { clip-path: inset(0 100% 0 0); }
    to   { clip-path: inset(0 0 0 0); }
  }
  /* The nib runs the width of the word, then lifts where the macron belongs. */
  @keyframes nib-travel {
    0%   { left: 0;    opacity: 0; transform: scaleY(.4); }
    8%   { opacity: 1; transform: scaleY(1); }
    82%  { left: calc(100% - .14em); opacity: 1; }
    100% { left: calc(100% - .14em); opacity: 0; transform: translateY(-.14em) scaleY(.7); }
  }
  @keyframes macron-settle {
    from { opacity: 0; transform: scaleX(.6); }
    to   { opacity: 1; transform: scaleX(1); }
  }
  @keyframes fade-up-by {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: .72; transform: none; }
  }
  @keyframes macron-pulse {
    0%, 100% { opacity: 1;   transform: scaleX(1); }
    50%      { opacity: .55; transform: scaleX(.42); }
  }
  @media (prefers-reduced-motion: reduce) {
    .splash-reveal { clip-path: none; animation: none; }
    .splash-nib { display: none; }
    .splash-word .o::after { opacity: 1; animation: none; }
    .splash-by { animation: none; }
  }

  #noscript {
    max-width: 34ch;
    text-align: center;
    font: 400 14px/1.6 ui-sans-serif, system-ui, sans-serif;
    color: #635c52;
  }
</style>
</head>
<body>

<div id="boot" role="status" aria-label="Loading MIKŌ">
  <div class="splash">
    <div class="splash-word" aria-hidden="true"><span class="splash-reveal">MIK<span class="o">O</span></span><span class="splash-nib"></span></div>
    <div class="splash-by">by <span class="splash-co">Quantamania</span></div>
  </div>
</div>

<noscript>
  <div style="display:grid;place-items:center;height:100dvh;padding:24px">
    <p id="noscript">
      MIKŌ needs JavaScript to run. Everything happens in your browser —
      there is no server doing the work.
    </p>
  </div>
</noscript>

<div id="landing" hidden></div>
<div id="app"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
